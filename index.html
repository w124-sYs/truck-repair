
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>货车修理厂统计系统</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --primary:#1e6fd9; --primary-dark:#1557b0; --bg:#f4f6f9;
    --card:#fff; --border:#e2e6ec; --text:#2b3440; --muted:#7a8699;
    --green:#16a34a; --red:#dc2626; --amber:#d97706;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif; background:var(--bg); color:var(--text); font-size:14px;}
  .app{max-width:1200px; margin:0 auto; padding:16px;}
  header{background:linear-gradient(135deg,#1e6fd9,#3b82f6); color:#fff; border-radius:12px; padding:20px 24px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
  header h1{font-size:20px; font-weight:700;}
  header .sub{font-size:12px; opacity:.85; margin-top:4px;}
  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .tab{padding:10px 20px; border-radius:8px; background:#fff; border:1px solid var(--border); cursor:pointer; font-weight:600; transition:.2s; user-select:none;}
  .tab.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .tab:hover:not(.active){border-color:var(--primary); color:var(--primary);}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px;}
  .stat{background:#fff; border-radius:10px; padding:16px; border:1px solid var(--border);}
  .stat .num{font-size:26px; font-weight:700; color:var(--primary);}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:4px;}
  .panel{background:#fff; border-radius:12px; border:1px solid var(--border); padding:20px; margin-bottom:16px;}
  .panel h2{font-size:16px; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:12px; color:var(--muted); font-weight:600;}
  input,select{height:38px; padding:0 10px; border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none; transition:.2s;}
  input:focus,select:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(30,111,217,.12);}
  .btn{height:38px; padding:0 18px; border:none; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; transition:.2s;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-green{background:var(--green); color:#fff;}
  .btn-green:hover{background:#128a3e;}
  .btn-ghost{background:#fff; color:var(--primary); border:1px solid var(--primary);}
  .btn-ghost:hover{background:#eef5ff;}
  .btn-danger{background:#fff; color:var(--red); border:1px solid var(--red);}
  .btn-danger:hover{background:#fef2f2;}
  .btn-sm{height:30px; padding:0 10px; font-size:12px;}
  .actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:10px 8px; text-align:left; border-bottom:1px solid var(--border);}
  th{background:#f8fafc; color:var(--muted); font-weight:600; white-space:nowrap;}
  tr:hover td{background:#fafbfd;}
  .money{color:var(--red); font-weight:600;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
  .toolbar input{width:160px;}
  .empty{text-align:center; color:var(--muted); padding:30px;}
  .badge{display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600;}
  .badge-green{background:#e7f6ec; color:var(--green);}
  .badge-amber{background:#fef3e2; color:var(--amber);}
  .toast{position:fixed; top:20px; right:20px; background:#2b3440; color:#fff; padding:12px 20px; border-radius:8px; opacity:0; transform:translateY(-10px); transition:.3s; z-index:999; font-size:13px;}
  .toast.show{opacity:1; transform:translateY(0);}
  .summary-row{background:#f0f7ff !important;}
  .summary-row td{font-weight:700;}
  @media(max-width:600px){.form-grid{grid-template-columns:1fr 1fr;} header{padding:16px;}}
  .btn-print{background:#fff; color:var(--amber); border:1px solid var(--amber);}
  .btn-print:hover{background:#fff7ed;}
  /* 打印区域（屏幕隐藏） */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; left:0; top:0; width:100%; padding:20px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>🚚 货车修理厂统计系统</h1>
      <div class="sub">修理信息统计 · 采购货物统计 · 数据本地保存 · 支持导出Excel</div>
    </div>
    <div class="actions">
      <button class="btn" style="background:rgba(255,255,255,.2);color:#fff" onclick="backup()">💾 备份数据</button>
      <button class="btn" style="background:rgba(255,255,255,.2);color:#fff" onclick="document.getElementById('restoreFile').click()">📂 恢复数据</button>
      <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restore(event)">
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('repair',this)">🔧 修理统计</div>
    <div class="tab" onclick="switchTab('purchase',this)">📦 采购统计</div>
    <div class="tab" onclick="switchTab('inventory',this)">📊 库存查看</div>
    <div class="tab" onclick="switchTab('finance',this)">💰 财务</div>
  </div>

  <!-- ============ 修理统计 ============ -->
  <div id="repairTab">
    <div class="cards" id="repairStats"></div>
    <div class="panel">
      <h2>➕ 新增修理记录</h2>
      <div style="margin-bottom:16px;padding:12px;background:#fff8e6;border:1px dashed #e0a800;border-radius:8px">
        <label style="font-size:12px;color:#8a6d00;font-weight:600">📋 粘贴修理消息自动识别（粘贴后点“识别”，自动填入下方表单）</label>
        <textarea id="rPaste" rows="6" style="width:100%;margin-top:8px;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box" placeholder="把修理消息粘贴到这里，例如：&#10;云G09079D&#10;焊后半夜&#10;焊接货箱拉链&#10;U行扣3个&#10;工时100&#10;谭稳2026.9.23"></textarea>
        <div style="margin-top:8px;display:flex;gap:8px">
          <button type="button" class="btn btn-primary btn-sm" onclick="parseRepair()">✨ 识别并填入</button>
          <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('rPaste').value=''">清空</button>
        </div>
      </div>
      <div class="form-grid">
        <div class="field"><label>修理工姓名 *</label><input id="rWorker" placeholder="如：张三"></div>
        <div class="field"><label>车牌号 *</label><input id="rPlate" placeholder="如：鲁A12345"></div>
        <div class="field"><label>客户名称</label><input id="rCustomer" placeholder="选填"></div>
        <div class="field"><label>修理项目 *</label><input id="rItem" placeholder="如：更换刹车片"></div>
      </div>
      <div style="margin-top:16px">
        <label style="font-size:12px;color:var(--muted);font-weight:600">所用配件（选配件会自动扣减库存、自动算售价）</label>
        <div id="repairPartsList" style="margin-top:8px;display:flex;flex-direction:column;gap:8px"></div>
        <button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="addPartRow()">➕ 添加配件</button>
      </div>
      <div class="form-grid" style="margin-top:16px">
        <div class="field"><label>工时费(元)</label><input id="rHourPrice" type="number" step="0.01" min="0" placeholder="0"></div>
        <div class="field"><label>修理日期</label><input id="rDate" type="date"></div>
        <div class="field"><label>备注</label><input id="rNote" placeholder="选填"></div>
      </div>
      <div style="margin-top:16px;padding:14px 16px;background:#f0f7ff;border-radius:8px;display:flex;align-items:center;gap:12px;font-size:15px">
        <span style="font-weight:700">共计：</span>
        <span id="rTotal" style="font-size:22px;font-weight:700;color:var(--red)">¥0.00</span>
        <span style="color:var(--muted);font-size:12px">（工时费 + 配件售价自动合计）</span>
      </div>
      <div class="actions" style="margin-top:16px">
        <button class="btn btn-primary" id="repairSaveBtn" onclick="addRepair()">保存记录</button>
        <button class="btn btn-ghost" onclick="clearRepairForm()">清空</button>
        <button class="btn btn-ghost" id="repairCancelBtn" style="display:none" onclick="cancelEditRepair()">取消编辑</button>
      </div>
    </div>
    <div class="panel">
      <h2>📋 修理记录明细</h2>
      <div class="toolbar">
        <input id="rFilterKw" placeholder="🔍 关键词搜索" oninput="renderRepair()">
        <input id="rFilterWorker" placeholder="按修理工筛选" oninput="renderRepair()">
        <input id="rFilterPlate" placeholder="按车牌号筛选" oninput="renderRepair()">
        <input id="rFilterDate" type="date" onchange="renderRepair()">
        <button class="btn btn-ghost btn-sm" onclick="resetRepairFilter()">重置筛选</button>
        <span style="flex:1"></span>
        <button class="btn btn-print" onclick="printByPlate()">🖨 按车牌打印</button>
        <button class="btn btn-green" onclick="exportRepair()">⬇ 导出Excel</button>
      </div>
      <div style="overflow-x:auto" id="repairTableWrap"></div>
    </div>
  </div>

  <!-- ============ 采购统计 ============ -->
  <div id="purchaseTab" style="display:none">
    <div class="cards" id="purchaseStats"></div>
    <div class="panel">
      <h2>➕ 新增采购记录</h2>
      <div class="form-grid">
        <div class="field"><label>配件/材料名称 *</label><input id="pName" placeholder="如：机油"></div>
        <div class="field"><label>数量 *</label><input id="pQty" type="number" min="0" step="0.01" placeholder="0"></div>
        <div class="field"><label>进价(元) *</label><input id="pPrice" type="number" min="0" step="0.01" placeholder="0"></div>
        <div class="field"><label>售价(元)</label><input id="pSale" type="number" min="0" step="0.01" placeholder="0"></div>
        <div class="field"><label>供应商</label><input id="pSupplier" placeholder="如：XX配件城"></div>
        <div class="field"><label>采购日期</label><input id="pDate" type="date"></div>
        <div class="field"><label>经办人</label><input id="pBuyer" placeholder="如：李四"></div>
        <div class="field"><label>备注</label><input id="pNote" placeholder="选填"></div>
      </div>
      <div class="actions" style="margin-top:16px">
        <button class="btn btn-primary" id="purchaseSaveBtn" onclick="addPurchase()">保存记录</button>
        <button class="btn btn-ghost" onclick="clearPurchaseForm()">清空</button>
        <button class="btn btn-ghost" id="purchaseCancelBtn" style="display:none" onclick="cancelEditPurchase()">取消编辑</button>
      </div>
    </div>
    <div class="panel">
      <h2>📋 采购记录明细</h2>
      <div class="toolbar">
        <input id="pFilterName" placeholder="按名称搜索" oninput="renderPurchase()">
        <input id="pFilterSupplier" placeholder="按供应商筛选" oninput="renderPurchase()">
        <input id="pFilterDate" type="date" onchange="renderPurchase()">
        <button class="btn btn-ghost btn-sm" onclick="resetPurchaseFilter()">重置筛选</button>
        <span style="flex:1"></span>
        <button class="btn btn-green" onclick="exportPurchase()">⬇ 导出Excel</button>
      </div>
      <div style="overflow-x:auto" id="purchaseTableWrap"></div>
    </div>
  </div>

  <!-- ============ 库存查看 ============ -->
  <div id="inventoryTab" style="display:none">
    <div class="cards" id="inventoryStats"></div>
    <div class="panel">
      <h2>📊 库存一览
        <div class="actions">
          <button class="btn btn-ghost btn-sm" onclick="exportInventory()">⬇ 导出Excel</button>
        </div>
      </h2>
      <div class="toolbar">
        <input id="invFilter" placeholder="按配件名称筛选" oninput="renderInventory()">
        <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="invOnlyLow" style="width:auto;height:auto" onchange="renderInventory()"> 只看库存不足</label>
        <span style="flex:1"></span>
        <button class="btn btn-ghost btn-sm" onclick="manualStock()">➕ 手动调整库存</button>
      </div>
      <div style="overflow-x:auto" id="inventoryTableWrap"></div>
    </div>
  </div>

  <!-- ============ 财务 ============ -->
  <div id="financeTab" style="display:none">
    <div class="cards" id="financeStats"></div>
    <div class="panel">
      <h2>💰 财务汇总
        <div class="actions">
          <button class="btn btn-green btn-sm" onclick="exportFinance()">⬇ 导出Excel</button>
        </div>
      </h2>
      <div class="toolbar">
        <input id="fFilterMonth" type="month" onchange="renderFinance()">
        <button class="btn btn-ghost btn-sm" onclick="resetFinanceFilter()">重置筛选</button>
        <span style="flex:1"></span>
      </div>
      <div style="overflow-x:auto" id="financeTableWrap"></div>
    </div>

    <div class="panel">
      <h2>👷 修理工工时提成
        <div class="actions">
          <button class="btn btn-green btn-sm" onclick="exportWorkerStat()">⬇ 导出Excel</button>
        </div>
      </h2>
      <div class="toolbar" style="margin-bottom:12px">
        <label style="font-size:13px;display:flex;align-items:center;gap:6px">提成比例(%)：
          <input id="commissionRate" type="number" step="1" min="0" max="100" value="50" style="width:80px" onchange="saveCommission()">
        </label>
        <span style="color:var(--muted);font-size:12px">提成 = 工时费 × 比例</span>
        <span style="flex:1"></span>
      </div>
      <div style="overflow-x:auto" id="workerStatWrap"></div>
    </div>

    <div class="panel">
      <h2>💼 日常开支（工资、水电、房租等）</h2>
      <div class="form-grid">
        <div class="field"><label>开支项目 *</label><input id="eItem" placeholder="如：工资、水电费、房租"></div>
        <div class="field"><label>金额(元) *</label><input id="eAmount" type="number" step="0.01" min="0" placeholder="0"></div>
        <div class="field"><label>日期 *</label><input id="eDate" type="date"></div>
        <div class="field"><label>备注</label><input id="eNote" placeholder="选填"></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-primary" onclick="addExpense()">➕ 记一笔开支</button>
      </div>
      <div style="overflow-x:auto;margin-top:16px" id="expenseTableWrap"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
// ================= 数据层 =================
const STORE_KEY = 'truck_repair_shop_data_v1';
function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(!d.inventory) d.inventory = [];
      if(!d.expenses) d.expenses = [];
      if(!d.commissionRate && d.commissionRate!==0) d.commissionRate = 50;
      return d;
    }
  }catch(e){ console.error(e); }
  return { repairs:[], purchases:[], inventory:[], expenses:[], commissionRate:50 };
}
function saveData(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}
let state = loadData();

function today(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n){ return '¥' + Number(n||0).toFixed(2); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// ================= 库存工具 =================
// 根据配件名称查找库存项（精确匹配）
function findInv(name){
  return state.inventory.find(i=>i.name===name);
}
// 入库：增加库存（采购时调用），可带售价
function stockIn(name, qty, sale){
  if(!name || !qty) return;
  let inv = findInv(name);
  if(inv){
    inv.qty = Math.round((inv.qty + qty)*100)/100;
    if(sale && sale>0) inv.sale = sale; // 更新售价
  }else{
    state.inventory.push({ name, qty, unit:'', sale: sale||0 });
  }
}
// 出库：减少库存（修理时调用），返回是否成功
function stockOut(name, qty){
  if(!name || !qty) return true;
  let inv = findInv(name);
  if(!inv){ toast(`⚠️ 库存中没有「${name}」`); return false; }
  if(inv.qty < qty){ toast(`⚠️ 「${name}」库存不足（现有 ${inv.qty}）`); return false; }
  inv.qty = Math.round((inv.qty - qty)*100)/100;
  return true;
}

// ================= 工具 =================
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2000);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function switchTab(tab, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('repairTab').style.display = tab==='repair'?'block':'none';
  document.getElementById('purchaseTab').style.display = tab==='purchase'?'block':'none';
  document.getElementById('inventoryTab').style.display = tab==='inventory'?'block':'none';
  document.getElementById('financeTab').style.display = tab==='finance'?'block':'none';
  if(tab==='inventory') renderInventory();
  if(tab==='finance') renderFinance();
}

// ================= 修理统计 =================
let partRowSeq = 0;
let editingRepairId = null;

// 中文数字转阿拉伯数字（如“三”→“3”），返回 null 表示不是中文数字
function cnNum(s){
  const map = {'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
  s = s.trim();
  if(/^[0-9]+(\.[0-9]+)?$/.test(s)) return parseFloat(s);
  if(s.length===1 && map[s]) return map[s];
  if(s==='十') return 10;
  // 处理“十五”“二十三”这类
  if(s.includes('十')){
    const parts = s.split('十');
    const a = parts[0]===''?1:(map[parts[0]]||0);
    const b = parts[1]===''?0:(map[parts[1]]||0);
    if(a===0 && parts[0]!=='') return null;
    return a*10+b;
  }
  return null;
}

// 粘贴修理消息，自动识别字段
function parseRepair(){
  const raw = document.getElementById('rPaste').value;
  if(!raw.trim()){ toast('请先粘贴修理消息'); return; }
  let lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length<3){ toast('内容太短，无法识别'); return; }

  // 1. 车牌号 = 第一行
  const plate = lines[0];
  document.getElementById('rPlate').value = plate;

  // 2. 日期 + 修理工：在最后一行（或最后两行）中找日期和名字
  let worker = '';
  let date = '';
  const dateRe = /(20\d{2})[.\-/年](\d{1,2})[.\-/月](\d{1,2})?日?/;
  // 从最后一行往前找日期
  let dateLineIdx = -1;
  for(let i=lines.length-1;i>=1;i--){
    const m = lines[i].match(dateRe);
    if(m){
      dateLineIdx = i;
      const y = m[1];
      const mo = String(m[2]).padStart(2,'0');
      const d = m[3]? String(m[3]).padStart(2,'0') : '01';
      date = `${y}-${mo}-${d}`;
      // 去掉日期部分，剩下的就是修理工名字
      worker = lines[i].replace(dateRe,'').replace(/[.\-/年月日]/g,'').trim();
      break;
    }
  }
  // 如果最后一行没日期，往前一行找名字
  if(!worker && dateLineIdx>0){
    worker = lines[dateLineIdx-1].trim();
  }
  // 如果还没找到名字，用倒数第二行（不含日期行）
  if(!worker){
    for(let i=lines.length-1;i>=1;i--){
      if(!lines[i].match(dateRe) && !lines[i].startsWith('工时')){
        worker = lines[i];
        break;
      }
    }
  }
  if(worker) document.getElementById('rWorker').value = worker;
  if(date) document.getElementById('rDate').value = date;

  // 3. 工时费：找“工时XXX”或“工时费XXX”
  let labor = 0;
  lines.forEach(l=>{
    const m = l.match(/工时[费价]?\s*[:：]?\s*(\d+(?:\.\d+)?)/);
    if(m) labor = parseFloat(m[1]);
  });
  if(labor) document.getElementById('rHourPrice').value = labor;

  // 4. 材料行：以“材料”开头，或含数字（阿拉伯/中文）且不是车牌/工时/日期/名字的行
  const partLines = [];
  lines.forEach((l,idx)=>{
    if(idx===0) return; // 跳过车牌
    if(l.startsWith('工时')) return;
    if(l.match(dateRe)) return;
    if(l===worker || l===date) return;
    // 以“材料”开头的行一定是材料行；否则含数字才算
    if(l.startsWith('材料') || /\d/.test(l) || /[一二两三四五六七八九十]/.test(l)){
      partLines.push(l);
    }
  });

  // 5. 修理项目 = 车牌行之后、第一个材料行/工时行/名字行之前的所有行
  let itemLines = [];
  for(let i=1;i<lines.length;i++){
    const l = lines[i];
    if(l.startsWith('工时')) break;
    if(l.match(dateRe)) break;
    if(l===worker && worker) break;
    if(partLines.includes(l)) break;
    itemLines.push(l);
  }
  if(itemLines.length) document.getElementById('rItem').value = itemLines.join('、');

  // 6. 填充配件行
  document.getElementById('repairPartsList').innerHTML = '';
  partRowSeq = 0;
  partLines.forEach(l=>{
    // 提取数量：中文数字或阿拉伯数字，后面可能跟“个/件/套/桶/只/条”等
    // 去掉开头的“材料”提示词（如“材料扣叶两个”→“扣叶两个”）
    let body = l.replace(/^材料[：:]?\s*/, '');
    // 提取数量：中文数字或阿拉伯数字，后面可能跟“个/件/套/桶/只/条”等
    const mNum = body.match(/([0-9]+(?:\.[0-9]+)?|[一二两三四五六七八九十]+)\s*[个件套桶只条支根张把副对]?\s*$/);
    let name = body;
    let qty = 1;
    if(mNum){
      const n = cnNum(mNum[1]);
      if(n!==null){
        qty = n;
        name = body.slice(0, mNum.index).trim();
      }
    }
    if(name) addPartRow(name, qty);
  });

  recalcTotal();
  toast('✅ 已识别并填入表单，请核对后保存');
}

// 添加一行配件选择
function addPartRow(partName, partQty){
  const wrap = document.getElementById('repairPartsList');
  partRowSeq++;

  const options = invNames.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');

  div.className = 'part-row';
  div.style.cssText = 'display:flex;gap:8px;align-items:center;';
  div.innerHTML = `
    <input list="invList" class="part-name" placeholder="选择或输入配件名" value="${esc(partName||'')}" style="flex:1">

    <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove();recalcPartCost()">✕</button>
  `;
  div.querySelector('.part-name').addEventListener('input', function(){ showPartSale(div); });
  div.querySelector('.part-qty').addEventListener('input', function(){ showPartSale(div); });
  wrap.appendChild(div);

// 显示该配件行的售价信息，并联动总计
function showPartSale(div){
  const name = div.querySelector('.part-name').value.trim();
  const qty = parseFloat(div.querySelector('.part-qty').value)||0;
  const inv = findInv(name);
  const saleEl = div.querySelector('.part-sale');
  if(inv && inv.sale>0){
    saleEl.textContent = `售价 ¥${inv.sale}${qty>0?` / 小计 ¥${(inv.sale*qty).toFixed(2)}`:''}`;
  }else{
    saleEl.textContent = inv ? '无售价' : '';
  }
  recalcTotal();
}
// 计算总计 = 工时费 + 所有配件售价
function recalcTotal(){
  // 配件售价合计
  const rows = document.querySelectorAll('#repairPartsList .part-row');
  let partsTotal = 0;
  rows.forEach(row=>{
    const name = row.querySelector('.part-name').value.trim();
    const qty = parseFloat(row.querySelector('.part-qty').value)||0;
    const inv = findInv(name);
    if(inv && inv.sale>0 && qty>0) partsTotal += inv.sale * qty;
  });
  // 工时费
  const labor = parseFloat(document.getElementById('rHourPrice').value)||0;
  const total = partsTotal + labor;
  document.getElementById('rTotal').textContent = fmtMoney(total);
  return total;
}
// 收集配件明细
function collectParts(){
  const rows = document.querySelectorAll('#repairPartsList .part-row');
  const parts = [];
  rows.forEach(row=>{
    const name = row.querySelector('.part-name').value.trim();
    const qty = parseFloat(row.querySelector('.part-qty').value);
    if(name && qty>0) parts.push({ name, qty });
  });
  return parts;
}

function addRepair(){
  const worker = document.getElementById('rWorker').value.trim();
  const plate = document.getElementById('rPlate').value.trim();
  const item = document.getElementById('rItem').value.trim();
  if(!worker || !plate || !item){ toast('请填写修理工、车牌号、修理项目'); return; }
  const parts = collectParts();

  if(editingRepairId){
    // 编辑模式：先归还旧记录库存，再按新记录扣库存
    const old = state.repairs.find(r=>r.id===editingRepairId);
    if(old && old.parts){ old.parts.forEach(p=>stockIn(p.name, p.qty)); }
    // 校验新配件库存
    for(const p of parts){
      const inv = findInv(p.name);
      if(!inv || inv.qty < p.qty){ toast(`⚠️ 配件「${p.name}」库存不足，无法保存`); return; }
    }
    for(const p of parts){ stockOut(p.name, p.qty); }
    const labor = parseFloat(document.getElementById('rHourPrice').value)||0;
    const total = recalcTotal();
    Object.assign(old, {
      worker, plate, item, parts, labor, cost: total,
      customer: document.getElementById('rCustomer').value.trim(),
      date: document.getElementById('rDate').value || today(),
      note: document.getElementById('rNote').value.trim(),
    });
    editingRepairId = null;
    document.getElementById('repairSaveBtn').textContent = '💾 保存记录';
    saveData(); clearRepairForm(); renderRepair(); renderInventory(); toast('✅ 修理记录已更新');
    return;
  }

  // 新增模式
  // 先校验库存是否充足
  for(const p of parts){
    const inv = findInv(p.name);
    if(!inv || inv.qty < p.qty){ toast(`⚠️ 配件「${p.name}」库存不足，无法保存`); return; }
  }
  // 扣减库存
  for(const p of parts){ stockOut(p.name, p.qty); }
  const labor = parseFloat(document.getElementById('rHourPrice').value)||0;
  const total = recalcTotal(); // 总计 = 工时费 + 配件售价
  state.repairs.push({
    id: uid(), worker, plate,
    item, parts,
    labor,
    cost: total, // 总计金额
    customer: document.getElementById('rCustomer').value.trim(),
    date: document.getElementById('rDate').value || today(),
    note: document.getElementById('rNote').value.trim(),
  });
  saveData(); clearRepairForm(); renderRepair(); renderInventory(); toast('✅ 修理记录已保存，配件已扣减库存');
}

// 金额转中文大写
function rmbUpper(n){
  n = Math.round((Number(n)||0)*100)/100;
  if(n===0) return '零元整';
  const digits = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
  const units = ['','拾','佰','仟'];
  const bigUnits = ['','万','亿'];
  let yuan = Math.floor(n);
  let jiao = Math.round((n - yuan)*100);
  let result = '';
  if(yuan>0){
    let str = String(yuan);
    let len = str.length;
    let group = [];
    for(let i=len; i>0; i-=4){
      let start = Math.max(0, i-4);
      group.unshift(str.slice(start, i));
    }
    group.forEach((g, gi)=>{
      let gStr = '';
      let zeroFlag = false;
      for(let j=0; j<g.length; j++){
        let d = parseInt(g[j]);
        let pos = g.length-1-j;
        if(d===0){ zeroFlag = true; }
        else {
          if(zeroFlag && gStr) gStr += '零';
          gStr += digits[d] + units[pos];
          zeroFlag = false;
        }
      }
      if(gStr){
        result += gStr + bigUnits[group.length-1-gi];
      }
    });
    result += '元';
  }
  if(jiao===0){ result += '整'; }
  else {
    let jiaoNum = Math.floor(jiao/10);
    let fenNum = jiao%10;
    if(jiaoNum>0) result += digits[jiaoNum] + '角';
    if(fenNum>0) result += digits[fenNum] + '分';
  }
  return result;
}

let editingPurchaseId = null;
function addPurchase(){
  const name = document.getElementById('pName').value.trim();
  const qty = parseFloat(document.getElementById('pQty').value);
  const price = parseFloat(document.getElementById('pPrice').value);
  const sale = parseFloat(document.getElementById('pSale').value)||0;
  if(!name || isNaN(qty) || isNaN(price)){ toast('请填写名称、数量、进价'); return; }

  if(editingPurchaseId){
    // 编辑模式：归还旧库存，再按新数据入库
    const old = state.purchases.find(p=>p.id===editingPurchaseId);
    if(old){ stockOut(old.name, old.qty); } // 归还旧库存
    Object.assign(old, {
      name, qty, price, sale,
      amount: Math.round(qty*price*100)/100,
      supplier: document.getElementById('pSupplier').value.trim(),
      date: document.getElementById('pDate').value || today(),
      buyer: document.getElementById('pBuyer').value.trim(),
      note: document.getElementById('pNote').value.trim(),
    });
    stockIn(name, qty, sale);
    editingPurchaseId = null;
    document.getElementById('purchaseSaveBtn').textContent = '💾 保存记录';
    document.getElementById('purchaseCancelBtn').style.display = 'none';
    saveData(); clearPurchaseForm(); renderPurchase(); renderInventory(); toast('✅ 采购记录已更新');
    return;
  }

  state.purchases.push({
    id: uid(), name,
    qty, price, sale,
    amount: Math.round(qty*price*100)/100,
    supplier: document.getElementById('pSupplier').value.trim(),
    date: document.getElementById('pDate').value || today(),
    buyer: document.getElementById('pBuyer').value.trim(),
    note: document.getElementById('pNote').value.trim(),
  });
  stockIn(name, qty, sale); // 自动入库（含售价）
  saveData(); clearPurchaseForm(); renderPurchase(); renderInventory(); toast('✅ 采购记录已保存，已自动入库');
}

// 手动调整库存
function manualStock(name){
  const cur = name ? (findInv(name)?.qty ?? 0) : 0;
  const nm = name ? name : prompt('请输入配件名称：');
  if(nm===null || !nm.trim()) return;
  const val = prompt(`配件「${nm}」当前库存：${cur}\n请输入调整后的库存数量：`, cur);
  if(val===null) return;
  const q = parseFloat(val);
  if(isNaN(q) || q<0){ toast('请输入有效数量'); return; }
  let inv = findInv(nm.trim());
  if(inv){ inv.qty = q; } else { state.inventory.push({ name: nm.trim(), qty: q, unit:'' }); }
  saveData(); renderInventory(); toast('✅ 库存已调整');
}

}

// ================= 财务 =================
function renderFinance(){
  const month = document.getElementById('fFilterMonth').value; // 如 2026-10
  // 按月份筛选（不选则全部）
  let repairs = state.repairs;
  let purchases = state.purchases;
  let expenses = state.expenses;
  if(month){
    repairs = repairs.filter(r=>r.date.startsWith(month));
    purchases = purchases.filter(p=>p.date.startsWith(month));
    expenses = expenses.filter(e=>e.date.startsWith(month));
  }

  const income = repairs.reduce((s,r)=>s+(r.cost||0),0);
  const purchaseExpense = purchases.reduce((s,p)=>s+(p.amount||0),0);
  const otherExpense = expenses.reduce((s,e)=>s+(e.amount||0),0);
  const commissionExpense = repairs.reduce((s,r)=>s+((r.labor||0)*(state.commissionRate||0)/100),0);
  const expense = purchaseExpense + otherExpense + commissionExpense;
  const profit = income - expense;

  document.getElementById('financeStats').innerHTML = `
    <div class="stat"><div class="num money" style="color:var(--green)">${fmtMoney(income)}</div><div class="lbl">总收入（修理）</div></div>
    <div class="stat"><div class="num money" style="color:var(--red)">${fmtMoney(expense)}</div><div class="lbl">总支出</div></div>
    <div class="stat"><div class="num money" style="color:var(--red)">${fmtMoney(purchaseExpense)}</div><div class="lbl">其中采购</div></div>
    <div class="stat"><div class="num money" style="color:var(--red)">${fmtMoney(commissionExpense)}</div><div class="lbl">其中工时提成</div></div>
    <div class="stat"><div class="num money" style="color:var(--red)">${fmtMoney(otherExpense)}</div><div class="lbl">其中日常开支</div></div>
    <div class="stat"><div class="num money" style="color:${profit>=0?'var(--green)':'var(--red)'}">${fmtMoney(profit)}</div><div class="lbl">利润</div></div>
    <div class="stat"><div class="num">${repairs.length}</div><div class="lbl">修理车数</div></div>
  `;

  // 按月汇总表格
  const months = new Map();
  state.repairs.forEach(r=>{
    const m = (r.date||'').slice(0,7) || '未知';
    if(!months.has(m)) months.set(m, {income:0, purchase:0, other:0, commission:0, repairCount:0});
    months.get(m).income += r.cost||0;
    months.get(m).commission += (r.labor||0)*(state.commissionRate||0)/100;
    months.get(m).repairCount++;
  });
  state.purchases.forEach(p=>{
    const m = (p.date||'').slice(0,7) || '未知';
    if(!months.has(m)) months.set(m, {income:0, purchase:0, other:0, commission:0, repairCount:0});
    months.get(m).purchase += p.amount||0;
  });
  state.expenses.forEach(e=>{
    const m = (e.date||'').slice(0,7) || '未知';
    if(!months.has(m)) months.set(m, {income:0, purchase:0, other:0, commission:0, repairCount:0});
    months.get(m).other += e.amount||0;
  });
  const monthList = Array.from(months.entries()).sort((a,b)=>b[0].localeCompare(a[0]));

  if(monthList.length===0){
    document.getElementById('financeTableWrap').innerHTML = '<div class="empty">暂无数据</div>';
  } else {
    const rows = monthList.map(([m,v])=>{
      const exp = v.purchase + v.other + v.commission;
      const p = v.income - exp;
      return `<tr>
      <td>${esc(m)}</td>
      <td>${v.repairCount}</td>
      <td class="money">${fmtMoney(v.income)}</td>
      <td class="money">${fmtMoney(v.purchase)}</td>
      <td class="money">${fmtMoney(v.commission)}</td>
      <td class="money">${fmtMoney(v.other)}</td>
      <td class="money">${fmtMoney(exp)}</td>
      <td class="money" style="color:${p>=0?'var(--green)':'var(--red)'}">${fmtMoney(p)}</td>
    </tr>`;
    }).join('');
    document.getElementById('financeTableWrap').innerHTML = `
    <table>
      <thead><tr><th>月份</th><th>修理车数</th><th>收入</th><th>采购支出</th><th>工时提成</th><th>日常开支</th><th>总支出</th><th>利润</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  renderExpense();
  renderWorkerStat();
}

function renderWorkerStat(){

  const rate = state.commissionRate || 0;

// ================= 导出Excel =================
function exportSheet(data, name){
  if(!data.length){ toast('没有数据可导出'); return; }
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, name);
  XLSX.writeFile(wb, `${name}_${today()}.xlsx`);
  toast('✅ 已导出Excel');
}

function backup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `修理厂数据备份_${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('✅ 已备份');
}
function restore(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = JSON.parse(reader.result);
      if(!data.repairs || !data.purchases){ toast('❌ 文件格式不正确'); return; }
      if(!data.inventory) data.inventory = [];
      if(!data.expenses) data.expenses = [];
      if(!data.commissionRate && data.commissionRate!==0) data.commissionRate = 50;
      state = data; saveData(); renderRepair(); renderPurchase(); renderInventory(); toast('✅ 数据已恢复');
    }catch(err){ toast('❌ 文件解析失败'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
